name: Orca Linux Hardened Release

on:
  push:
    branches: ['release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orca-linux-hardened-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ORCA_UPSTREAM_SHA: 5ee4ace516080891731d100f843b074408a9ce0e
      ORCA_HARDENED_VERSION: 1.4.197-hardened.1
      CI: '1'
    steps:
      - name: Checkout hardening harness
        uses: actions/checkout@v4

      - name: Prepare pinned stable upstream source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/orca patches
          curl --fail --location --retry 5 \
            "https://codeload.github.com/stablyai/orca/tar.gz/${ORCA_UPSTREAM_SHA}" \
            | tar -xz --strip-components=1 -C work/orca
          shopt -s nullglob
          parts=(patches/orca-linux-hardened.green.part-*)
          if [[ ${#parts[@]} -eq 0 ]]; then
            echo 'No GREEN hardening patch segments found' >&2
            exit 1
          fi
          cat "${parts[@]}" > patches/orca-linux-hardened.patch
          git -C work/orca init -q
          git -C work/orca add -A
          git -C work/orca -c user.name=ci -c user.email=ci@example.invalid commit -qm baseline
          git -C work/orca apply --check ../../patches/orca-linux-hardened.patch
          git -C work/orca apply --whitespace=error ../../patches/orca-linux-hardened.patch
          printf 'upstream=%s\npatch_sha256=%s\n' \
            "$ORCA_UPSTREAM_SHA" \
            "$(sha256sum patches/orca-linux-hardened.patch | awk '{print $1}')" \
            | tee work/orca/hardening-inputs.txt

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.0.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: work/orca/pnpm-lock.yaml

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential python3 pkg-config libsecret-1-dev libx11-dev libxkbfile-dev \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 \
            libuuid1 libsecret-1-0 xvfb xdotool xclip fakeroot rpm desktop-file-utils

      - name: Install project dependencies
        working-directory: work/orca
        run: pnpm install --frozen-lockfile

      - name: Run hardening regression tests
        working-directory: work/orca
        shell: bash
        run: |
          set -euo pipefail
          pnpm test \
            src/main/daemon/terminal-spawn-admission.test.ts \
            src/main/daemon/linux-terminal-process-boundary.test.ts \
            src/main/daemon/terminal-session-owned-tree-teardown.test.ts \
            src/main/daemon/terminal-session-teardown.test.ts \
            src/main/runtime/orchestration/worker-terminal-auto-release.test.ts \
            src/renderer/src/components/native-chat/use-native-chat-composer-attachments-unmount.test.tsx \
            src/renderer/src/lib/terminal-worktree-renderability.test.ts
          pnpm exec vitest run --config config/vitest.config.ts \
            config/scripts/electron-builder-linux-hardened-config.test.mjs \
            config/scripts/build-linux-hardened.test.mjs

      - name: Run complete typecheck
        working-directory: work/orca
        run: pnpm tc

      - name: Run changed-code quality gates
        working-directory: work/orca
        run: pnpm run check:code-quality:changed

      - name: Run complete test suite
        working-directory: work/orca
        run: pnpm test

      - name: Build hardened Debian package
        working-directory: work/orca
        env:
          ORCA_HARDENED_LINUX: '1'
          ORCA_LOCAL_BUILD_VERSION: ${{ env.ORCA_HARDENED_VERSION }}
          ORCA_HARDENED_UPSTREAM_SHA: ${{ env.ORCA_UPSTREAM_SHA }}
          ORCA_HARDENED_BUILD_RUN: ${{ github.run_id }}
        run: pnpm run build:linux

      - name: Inspect Debian package
        shell: bash
        run: |
          cp scripts/verify-deb.sh work/orca/verify-deb.sh
          cd work/orca
          bash verify-deb.sh

      - name: Install and remove package smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd work/orca
          package=$(printf '%s\n' dist/orca-hardened_*.deb)
          sudo apt-get install -y "$package"
          test -x /usr/bin/orca-hardened
          test -f /usr/lib/systemd/user/orca-hardened-agents.slice
          test ! -e /usr/bin/orca-ide
          xvfb-run -a timeout 45 /usr/bin/orca-hardened --version \
            | tee dist/installed-version.txt
          grep -q '1.4.197-hardened.1' dist/installed-version.txt
          sudo apt-get purge -y orca-hardened
          test ! -e /usr/bin/orca-hardened
          test ! -e /usr/lib/systemd/user/orca-hardened-agents.slice

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: orca-hardened-linux-x64-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            work/orca/dist/orca-hardened_*.deb
            work/orca/dist/SHA256SUMS
            work/orca/dist/package-metadata.txt
            work/orca/dist/installed-version.txt
            work/orca/hardening-inputs.txt
            patches/orca-linux-hardened.patch
